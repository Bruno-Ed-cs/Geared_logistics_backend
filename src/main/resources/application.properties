spring.application.name=geared_logistics

# Carrega as variaveis do arquivo .env (se existir), sem falhar quando ausente
spring.config.import=optional:file:.env[.properties]

# ------------------------------------------------------------------
# Datasource (PostgreSQL) - valores sobrescreviveis por variaveis de ambiente
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geared_logistics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# Flyway (versionamento de schema)
# ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------------
# SpringDoc / OpenAPI
# ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
